name: release

# 推一个 tag（v0.1.0 这种）就自动打出模块包，并附到这个 tag 的发行版里。
# 这样"填库的网址就能装"才真的成立——核心会去发行的 assets 里找 .tgz。
#
# 注意：Gitee 这边没有 Actions，得手动传（见 README）。GitHub 是镜像，这里自动。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 跑测试（包能打出来但模块是坏的，那这个 release 就没意义）
        run: node --test test/*.test.mjs

      - name: 打包
        run: node scripts/pack.mjs

      - name: 校验包能装（解出来必须有 manifest）
        shell: bash
        run: |
          set -euo pipefail
          # 别用 `tar ... | head`：head 提前关管道会让 tar 收到 SIGPIPE(141)，
          # 在 pipefail 下整步失败——上一版就是这么挂的（release 一直没生成）。
          TGZ=($(ls -1 dist/*.tgz))
          PKG="${TGZ[0]}"
          echo "包：$PKG"
          tar -tzf "$PKG"
          rm -rf /tmp/pkgcheck && mkdir -p /tmp/pkgcheck
          tar -xzf "$PKG" -C /tmp/pkgcheck
          ls -la /tmp/pkgcheck
          test -f /tmp/pkgcheck/yuanling.module.json
          echo "✓ 包结构正常"

      - name: 附到发行版
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
